; CANScope Node 3 (CANScope Monitor) firmware (PlatformIO).
; Build: pio run -d firmware/monitor -e monitor   Flash: add -t upload --upload-port COMx
[platformio]
default_envs = monitor

; Shared settings. Board and platform are WORKING_ASSUMPTION values: the exact
; ESP32 module per node is not bench-verified (see docs/hardware-status.md).
[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 460800  ; == protocol serial.baud
lib_extra_dirs = ../common
build_src_flags = -Wall -Wextra
lib_deps =
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.12.1
  adafruit/Adafruit BusIO@1.17.1

[env:monitor]
build_src_filter = +<main.cpp>
