; CANScope node1 firmware (PlatformIO). Build: pio run -d firmware/node1 -e node1
[platformio]
default_envs = node1

; Shared settings. Board and platform are WORKING_ASSUMPTION values: the exact
; ESP32 module per node is UNVERIFIED (see docs/hardware-status.md).
[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../common
build_src_flags = -Wall -Wextra

[env:node1]
build_src_filter = +<main.cpp>

; Regression build of the ORIGINAL sketch, compiled unchanged from
; ../../sketch_node1_test/sketch_node1_test.ino via src/legacy_main.cpp. Not modified by CANScope.
[env:legacy_sketch]
build_src_filter = +<legacy_main.cpp>
